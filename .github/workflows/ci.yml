name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: black --check
        run: black --check src/pysoundmonitor tests scripts
      - name: pylint
        run: pylint src/pysoundmonitor tests scripts
      - name: Cache downloads
        # HVSC tunes are copyright works and are NEVER committed; they are
        # fetched from the HVSC mirror into pysidtracker's cache, persisted here.
        uses: anarkiwi/pysidtracker/.github/actions/cache@v0.48.1
        with:
          key: ${{ hashFiles('tests/*.py') }}
          tunes: tests
      - name: pytest + coverage (> 85%)
        # Synthetic Soundmonitor-format fixtures run offline; the HVSC corpus
        # tests read the tunes fetched above.
        # An individual tune skips only if genuinely unreachable after retries.
        run: pytest --cov=pysoundmonitor --cov-report=term-missing --cov-fail-under=85

  oracle:
    # Byte-exact comparison of SoundMonitorPlayer against the sidtrace sidplayfp
    # oracle over real HVSC Soundmonitor tunes. Never skipped: a failed HVSC
    # download or oracle render fails the job. HVSC tunes and oracle CSVs are cached.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Cache tunes and oracle traces
        uses: anarkiwi/pysidtracker/.github/actions/cache@v0.48.1
        with:
          key: ${{ hashFiles('tests/test_oracle_hvsc.py') }}
          sidtrace: "true"
          tunes: tests/test_oracle_hvsc.py
      - name: Oracle comparison (never skipped)
        run: pytest -m oracle -n auto

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Smoke test the wheel
        run: |
          pip install dist/*.whl
          python -c "import pysoundmonitor; print(pysoundmonitor.__version__)"
          python -c "import pysoundmonitor"
